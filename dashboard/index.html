<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Orquestrador Multiagente</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#090e1a;--panel:#111827;--raised:#172033;--line:#243049;--text:#e8eef7;--muted:#8a99b0;--blue:#4c8dff;--green:#2fd67b;--warn:#e0a83a;--err:#f06b62;--mono:Cascadia Mono,Consolas,monospace}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;min-height:100vh;font:14px/1.45 Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(1100px 520px at 50% -10%,#15213d,transparent) fixed,var(--bg)}
a{color:var(--blue);cursor:pointer;text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font:12px var(--mono)} .muted{color:var(--muted);font-size:12px}
.banner{display:none;padding:6px 20px;font-weight:600;background:var(--warn);color:#111}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:600;flex:1} #nav{display:flex;gap:6px}
.auto-approve-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raised);transition:all .2s ease}
.auto-approve-toggle:hover{border-color:var(--blue);color:var(--text)}
.auto-approve-toggle input[type="checkbox"]{cursor:pointer;accent-color:var(--green);width:14px;height:14px;margin:0}
.auto-approve-toggle.active{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 10%,var(--raised))}
#nav button,.tnav button{background:none;color:var(--muted)} #nav button.on{background:var(--raised);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:18px 20px 40px} #tech{max-width:1400px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button.sec{background:#243049} button.danger{background:#b62324}
.bd{background:#243049;border-radius:8px;padding:0 6px;font-size:11px} .bd.e{background:#b62324} .bd:empty{display:none}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.s-ok,.s-completed,.s-approved,.s-passed{color:var(--green);border-color:var(--green)}
.s-warn,.s-completed_unreviewed,.s-needs_human,.s-paused,.s-awaiting_review,.s-checking,.s-no_active_checks,.s-blocked,.s-needs_attention,.s-interrupted,.s-completed_with_issues,.s-quota_exceeded,.s-contract_not_verified,.s-planned,.s-changes_requested,.s-skipped{color:var(--warn);border-color:var(--warn)}
.s-err,.s-failed,.s-rejected,.s-unavailable,.s-canceled{color:var(--err);border-color:var(--err)}
.s-run,.s-planning,.s-delegating,.s-reviewing,.s-running,.s-queued,.s-pending{color:var(--blue);border-color:var(--blue)}
/* Início */
#idle{min-height:64vh;display:flex;flex-direction:column;justify-content:center;gap:24px}
#idle h1{font:400 34px/1.2 Georgia,'Iowan Old Style',serif;text-align:center;margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.box:focus-within{border-color:var(--blue)}
.box textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);font:16px/1.5 inherit;font-family:inherit;max-height:240px}
.bar2{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{background:none;color:var(--muted);padding:5px 14px;border-radius:8px} .seg button.on{background:var(--raised);color:var(--text)}
.send{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center} .send svg{width:18px;height:18px}
#run{animation:fade .5s ease}
@keyframes fade{from{opacity:0}}
.tl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.goal{flex:1;min-width:220px;font-weight:600}
.clip2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert{border:1px solid var(--warn);background:rgba(224,168,58,.08);border-radius:14px;padding:12px 16px;margin-top:14px;display:grid;gap:8px}
.ar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;margin-top:18px}
.ag{--c:var(--blue);display:grid;gap:14px;padding:22px;border-radius:22px;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,#0d1528),#0b1222 70%);box-shadow:0 0 28px color-mix(in srgb,var(--c) 18%,transparent);opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease;transition-delay:calc(var(--i)*.18s)}
.in .ag{opacity:1;transform:none}
.ag.work{--c:var(--green)} .ag.blk{--c:var(--warn)}
.ah{display:flex;align-items:center;gap:16px}
.logo{width:64px;height:64px;flex:none;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center} .logo svg,.logo img{width:38px;height:38px;object-fit:contain}
.nm{font-size:26px;font-weight:700;flex:1}
.sp{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:16px;border:1.5px solid var(--c);color:var(--c);font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 10%,transparent)}
.sp i{width:10px;height:10px;border-radius:50%;background:var(--c)} .work .sp i{animation:beat 1.6s infinite}
.hr{height:1px;background:var(--line)}
.al{font-size:13px;letter-spacing:.08em;font-weight:600;color:var(--muted);text-transform:uppercase}
.act{display:flex;gap:16px;align-items:center;min-height:52px} .act>div{min-width:0}
.ic{width:34px;height:34px;flex:none;color:var(--c,var(--muted))} .ic.spin{animation:spin 1s linear infinite}
.at{font-size:19px;font-weight:600} .ad{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{display:flex;gap:12px;align-items:center;color:var(--muted);white-space:nowrap} .ft .ic{width:20px;height:20px;color:var(--muted)}
.pb{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.pb b{display:block;height:100%;border-radius:5px;background:var(--c)} .pb b.ind{animation:slide 1.8s ease-in-out infinite alternate}
.approx{color:var(--warn);font-weight:700;cursor:help;margin-right:2px}
.mini{margin-top:18px;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel);border-collapse:separate;padding:4px 10px}
.mini td{padding:8px 6px;vertical-align:middle} .mini .ic{width:22px;height:22px}
.lk{margin-top:10px;padding:8px 14px;border:1px solid var(--warn);border-radius:10px;background:rgba(224,168,58,.08)} .lk.bad{border-color:var(--err);background:rgba(240,107,98,.1)}
@keyframes beat{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}}
@keyframes slide{to{margin-left:60%}} @keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Técnico */
.tgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
#tnav{display:grid;gap:3px;position:sticky;top:60px} .tnav button{display:flex;justify-content:space-between;text-align:left} #tnav button.on{background:var(--raised);color:var(--text)}
#tnav .grp{color:var(--muted);font-size:12px;margin:10px 6px 2px}
.tbar{display:flex;gap:10px;margin-bottom:14px} #exsel{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:200px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.sc,.box2{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;margin-bottom:8px} .sc.hum{border-color:var(--warn)}
.sh{display:flex;justify-content:space-between;gap:8px} .flow{font-weight:600} .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 7px;font-size:12px;color:var(--muted)} button.chip{cursor:pointer} button.chip.on{border-color:var(--blue);color:var(--blue)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.4 var(--mono);color:#c3cdd8;max-height:160px;overflow:auto}
.lr{border-bottom:1px solid var(--line);padding:4px 2px} .lr summary{display:flex;gap:10px;align-items:baseline;cursor:pointer;font-size:13px}
.lr .clip{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)} .tag{color:var(--blue);font-size:12px}
.lvl-error summary b,.lvl-error .clip,.lvl-error{color:var(--err)} .lvl-warning .clip,.lvl-warning{color:var(--warn)}
#toast{position:fixed;bottom:16px;right:16px;background:#243049;padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media (max-width:800px){.tgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="banner" id="checksBanner">Nenhuma checagem automática ativa: as revisões dependem só dos modelos. Veja config/checks.json e .\scripts\check_integrations.ps1.</div>
<div class="banner" id="mockBanner">MODO SIMULADO (ORCH_MOCK_AGENTS): agentes mock — nada aqui é integração real com os modelos.</div>
<header>
  <span class="brand">Workspace Multi-Provider <span class="muted" id="ver"></span></span>
  <label class="auto-approve-toggle" id="autoApproveToggleWrap" title="Aprovar automaticamente solicitações de permissão dos agentes (modifica AGY_AUTO_APPROVE_PERMISSIONS no .env)">
    <input type="checkbox" id="autoApproveToggle" onchange="toggleAutoApprove(this.checked)">
    <span>Auto-aprovar</span>
  </label>
  <nav id="nav"><button class="on" data-v="home" onclick="view('home')">Início</button><button data-v="tech" onclick="view('tech')">Técnico <span class="bd e" id="ecount"></span></button></nav>
  <span id="health" class="muted"></span>
</header>
<main id="home">
  <section id="idle">
    <h1>O que vamos construir hoje?</h1>
    <div class="box">
      <textarea id="goal" rows="2" placeholder="Descreva a funcionalidade…"></textarea>
      <div class="bar2">
        <div class="seg"><button class="on" data-m="plan_only" onclick="setMode(this)">Planejar</button><button data-m="full" onclick="setMode(this)">Fluxo completo</button></div>
        <button class="send" onclick="createTask()" title="Enviar" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </section>
  <section id="run" hidden>
    <div class="tl" id="tl"></div><div id="need"></div><div class="cards" id="cards"></div><div id="sel"></div>
  </section>
</main>
<main id="tech" hidden>
  <div class="tbar"><select id="exsel" onchange="if(this.value)select(this.value)"></select></div>
  <div class="tgrid"><nav id="tnav" class="tnav"></nav><div class="card" id="tbody"></div></div>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill = s => `<span class="pill s-${esc(s)}">${esc(s)}</span>`;
/*FR-BADGE-START*/
// Selo da revisão final: nenhum estado final silencioso (testado em tests/unit/test_dashboard_badge.py).
function finalReviewBadge(w){
  const st = w.final_review_state;
  if (st === 'disabled') return '<span class="pill s-warn" title="FINAL_REVIEW=false">revisão final desligada</span>';
  if (w.status === 'completed_unreviewed') return `<span class="pill s-warn" title="${esc(st)}">sem revisão final</span>`;
  if (st === 'accepted_by_human') return '<span class="pill s-warn">revisão final: aceita por decisão humana</span>';
  if (st === 'rejected_by_human') return '<span class="pill s-err">revisão final: rejeitada por decisão humana</span>';
  if (st && st !== 'passed' && st !== 'not_reached') return `<span class="pill s-warn">revisão final: ${esc(st)}</span>`;
  return '';
}
/*FR-BADGE-END*/
const t = iso => iso ? new Date(iso).toLocaleString('pt-BR') : '';
const ACTIVE=['queued','planning','delegating','reviewing'], CONF=/conflict|denied|blocked|busy|wait/i;
const RESUME=['blocked','failed','interrupted','completed_with_issues','planned','canceled','needs_human','paused','completed_unreviewed'];
const TS={subtasks:'Subtarefas',dag:'DAG de Workflow',providers:'Provedores & Modelos',costs:'Custos & Tokens',rag:'Contexto & RAG',messages:'Conversas A2A',files:'Arquivos',plan:'Plano e métricas',events:'Histórico',errors:'Erros',decisions:'Decisões técnicas',locks:'Reservas de arquivos',runs:'Chamadas aos modelos',allmsg:'Todas as conversas',agents:'Agentes e modelos',mcp:'MCP'};
let selected=null, hold=false, vw='home', tsec='subtasks', flt='todos', actApi=true, mode='plan_only', SHOWRUN=false;
let WF=[], AG=[], D=null, ACT=[], LK=[], LKH=[], ERR=[], DEC=[], MCPD={}, X={};

/* ícones inline (funcionam offline) */
const P={plan:'<circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M12 7.5V12m0 0H6v4.5M12 12h6v4.5"/>',code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',review:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',final:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',idle:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/>',bad:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',run:'<path d="M21 12a9 9 0 1 1-6.2-8.6"/>'};
const svg=(k,c)=>`<svg class="ic ${c||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const LOGO={
  gemini:'<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>',
  deepseek:'<svg viewBox="0 0 24 24"><path fill="#4D6BFE" d="M23.748 4.651c-.254-.124-.364.113-.512.233-.051.04-.094.09-.137.137-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.155-.708-.311-.955-.65-.172-.24-.219-.509-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.094.172.187.129.323-.082.28-.18.553-.266.833-.055.179-.137.218-.328.14a5.5 5.5 0 0 1-1.737-1.179c-.857-.828-1.631-1.743-2.597-2.46a12 12 0 0 0-.689-.47c-.985-.957.13-1.743.387-1.836.27-.098.094-.433-.778-.428-.872.003-1.67.295-2.687.685a3 3 0 0 1-.465.136 9.6 9.6 0 0 0-2.883-.101c-1.885.21-3.39 1.1-4.497 2.622C.082 8.776-.231 10.854.152 13.02c.403 2.284 1.568 4.175 3.36 5.653 1.857 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.132-.284 4.994-1.86.47.234.962.328 1.78.398.629.058 1.235-.031 1.705-.129.735-.155.684-.836.418-.961-2.155-1.004-1.682-.595-2.112-.926 1.095-1.295 2.768-3.598 3.284-6.733.05-.346.115-.834.108-1.114-.004-.171.035-.238.23-.257a4.2 4.2 0 0 0 1.545-.475c1.397-.763 1.96-2.016 2.093-3.517.02-.23-.004-.467-.247-.588M11.58 18.168c-2.088-1.642-3.101-2.183-3.52-2.16-.39.024-.32.472-.234.763.09.288.207.487.371.74.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.168-1.361-.801-2.5-1.86-3.301-3.306-.775-1.393-1.225-2.888-1.299-4.482-.02-.385.094-.522.477-.592a4.7 4.7 0 0 1 1.53-.038c2.131.311 3.946 1.264 5.467 2.774.868.86 1.525 1.887 2.202 2.89.72 1.066 1.494 2.082 2.48 2.915.348.291.626.513.892.677-.802.09-2.14.109-3.055-.615zm1.001-6.44a.306.306 0 0 1 .415-.287.3.3 0 0 1 .113.074.3.3 0 0 1 .086.214c0 .17-.136.307-.308.307a.303.303 0 0 1-.306-.307m3.11 1.596c-.2.081-.4.151-.591.16a1.25 1.25 0 0 1-.798-.254c-.274-.23-.47-.358-.551-.758a1.7 1.7 0 0 1 .015-.588c.07-.327-.007-.537-.238-.727-.188-.156-.426-.199-.689-.199a.6.6 0 0 1-.254-.078.253.253 0 0 1-.114-.358 1 1 0 0 1 .192-.21c.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.392.451.462.576.685.915.176.264.336.536.446.848.066.194-.02.353-.25.45"/></svg>'};
const short = n => String(n ?? '').split(/\s+[—–-]\s+/)[0];
const dn = n => { const x = AG.find(y => y.name.toLowerCase()===String(n).toLowerCase()); return x ? short(x.display_name) : (n||'—'); };
const logo = a => LOGO[String(a.name).toLowerCase()] || `<b style="font-size:26px">${esc(short(a.display_name)[0])}</b>`;

function ago(iso){ const s=Math.max(0,Math.floor((Date.now()-new Date(iso))/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return 'Há '+(h?`${h} h ${m} min`:m?`${m} min ${s%60}s`:`${s}s`); }
const appx = src => src==='inferido' ? '<span class="approx" title="Inferido do estado da tarefa (sem /activity): pode não ser exato.">~</span>' : '';
const liveAgo = (iso,src) => iso ? `${appx(src)}<span data-since="${esc(iso)}"></span>` : '—';
function tick(){ document.querySelectorAll('[data-since]').forEach(e => e.textContent = ago(e.dataset.since)); }
setInterval(tick, 1000);
// Renderização sem perder rolagem/seleção (FRONTEND.md, seção 2).
function setHTML(el, html, force){
  if(!el) return;
  if(!force){ if(el._h===html) return; const s=getSelection(); if(s && !s.isCollapsed && el.contains(s.anchorNode)) return; if(el.querySelector('details[open]')) return; }
  const sy=scrollY, st=el.scrollTop, ps=[...el.querySelectorAll('pre')].map(p=>p.scrollTop);
  el.innerHTML=html; el._h=html; el.scrollTop=st;
  el.querySelectorAll('pre').forEach((p,i)=>{ p.scrollTop=ps[i]||0; });
  scrollTo(0,sy); tick();
}
function toast(m){ const e=$('#toast'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3500); }
async function api(path, opt){ const r = await fetch(path, opt); if(!r.ok){ let d=''; try{d=(await r.json()).detail}catch{}; throw new Error(typeof d==='string'?d:(d&&d.detail)||JSON.stringify(d)||r.status);} return r.json(); }
const lastTs = d => (d.events||[]).map(e=>e.created_at).sort().pop() || d.created_at;

/* ---------- Atividade: um único ponto para "quem está fazendo o quê" ---------- */
// Formato: {agent, model, skill, subtask_id, started_at, source}; source: "inferido" (deduzido) ou "activity" (GET /activity).
function deriveActivity(d, agents){
  const ss=d.subtasks||[], m=n=>{ const a=(agents||[]).find(x=>x.name===n); return a?a.model:null; };
  const run=ss.find(s=>s.status==='running'), chk=ss.find(s=>s.status==='checking'), rev=ss.find(s=>['reviewing','awaiting_review'].includes(s.status));
  let agent=null, skill=null, sid=null;
  if(d.status==='planning'){ agent=d.planned_by||'gemini'; skill='planejamento'; }
  else if(run){ agent=run.assigned_to||run.agent; skill='implementação'; sid=run.id; }
  else if(chk){ agent='checagens'; skill='checagem automática'; sid=chk.id; }
  else if(rev){ agent=rev.reviewer; skill='revisão cruzada'; sid=rev.id; }
  else if(d.status==='reviewing'){ agent=(d.final_review&&d.final_review.reviewer)||null; skill='revisão final'; }
  if(!agent) return null;
  const sub=run||chk||rev||{};
  return {agent, model: agent==='checagens'?null:m(agent), skill, subtask_id:sid, detail:sub.title||null, progress:ss.length?ss.filter(s=>s.status==='approved').length/ss.length:null, started_at:lastTs(d), source:'inferido'};
}
async function loadActivity(){
  if(actApi){ try{ const r=await api('/activity'); const l=Array.isArray(r)?r:(r.items||[r]); ACT=l.filter(x=>x&&x.agent).map(x=>({...x,source:'activity'})); return afterAct(); }
    catch(e){ if(/not found|404/i.test(e.message)) actApi=false; } }
  const out=[];
  for(const w of WF.filter(w=>ACTIVE.includes(w.status)).slice(0,3)){ try{ const d=await api(`/tasks/${w.id}`); const a=deriveActivity(d,AG); if(a){ a.workflow_id=w.id; out.push(a); } }catch(e){} }
  ACT=out; afterAct();
}
function afterAct(){ if(SHOWRUN) renderRun(); if(vw==='tech'&&tsec==='agents') renderTech(); }

function agCard(a,i){
  const cur=ACT.find(x=>String(x.agent).toLowerCase()===a.name.toLowerCase()), blk=!a.accepting_work&&!cur;
  const [ti,de,ic]=cur?(ACTION[cur.skill]||[cur.skill||'Trabalhando','','code']):['Sem ação no momento','Aguardando a próxima etapa.','idle'];
  const pr=cur&&typeof cur.progress==='number'?Math.round(cur.progress*100):null;
  const spec=a.model_spec||{};
  const caps=(spec.capabilities||a.required_capabilities||[]);
  const tier=spec.cost_tier==='high'?'<span class="pill s-warn">Alto Desempenho</span>':(spec.cost_tier==='low'?'<span class="pill s-ok">Custo Baixo</span>':'<span class="pill s-run">Custo Padrão</span>');
  return `<div class="ag ${cur?'work':blk?'blk':''}" style="--i:${i}"><div class="ah"><div class="logo">${logo(a)}</div><div style="flex:1"><div class="nm">${esc(short(a.display_name))}</div><div class="muted mono" style="font-size:11px">${esc(a.model||'')} · ${esc(a.provider||'')}</div></div><span class="sp" title="${esc(a.blocked_reason||'')}"><i></i>${cur?'Trabalhando…':blk?'Indisponível':'Online'}</span></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0">${tier}${caps.map(c=>`<span class="pill" style="font-size:10px">${esc(c)}</span>`).join('')}</div>
    <div class="hr"></div><div class="al">Ação atual</div>
    <div class="act">${svg(ic)}<div><div class="at">${esc(ti)}</div><div class="ad">${esc(cur&&cur.detail?cur.detail:de)}</div></div></div>
    <div class="ft">${svg('clock')}<span>${cur?liveAgo(cur.started_at,cur.source):'—'}</span><div class="pb" title="${pr===null?'Sem progresso mensurável nesta etapa':'Subtarefas aprovadas da execução'}"><b class="${cur&&pr===null?'ind':''}" style="width:${cur?(pr===null?40:pr):0}%"></b></div></div></div>`; }
function seleneState(){
  const cs=((D&&D.subtasks)||[]).map(s=>s.checks&&s.checks.status).filter(Boolean);
  if(ACT.some(x=>x.agent==='checagens')) return ['run','Rodando…','spin'];
  if(cs.some(c=>/fail|unavailable|rejected/i.test(c))) return ['bad','Falhou',''];
  if(cs.some(c=>/attention|not_verified/i.test(c))) return ['warn','Atenção',''];
  if(cs.includes('no_active_checks')) return ['warn','Sem checagens ativas',''];
  if(cs.length&&cs.every(c=>c==='passed')) return ['ok','Passou',''];
  return ['idle','Em espera',''];
}

  setHTML($('#cards'), AG.map(agCard).join(''), force);
  const [k,txt,sp]=seleneState(), now=Date.now(), conf=LKH.filter(x=>CONF.test(x.action||'')&&now-new Date(x.created_at)<9e5);
  setHTML($('#sel'), `<table class="mini"><tr><td style="width:34px;color:var(--${k==='ok'?'green':k==='bad'?'err':k==='warn'?'warn':k==='run'?'blue':'muted'})">${svg(k==='idle'?'idle':k,sp)}</td><td><b>Selene</b></td><td class="muted" style="text-align:right">${txt}</td></tr></table>`
    +(conf.length?`<div class="lk bad"><b>Conflito de reserva:</b> ${conf.slice(0,3).map(x=>esc(x.resource)).join(', ')} <a onclick="tsec='locks';view('tech')">ver</a></div>`:'')
    +(LK.length?`<div class="lk">${LK.length} arquivo(s) reservado(s) agora <a onclick="tsec='locks';view('tech')">ver reservas</a></div>`:''), force);
}

  return `<div class="box2"><div><b>Revisão final</b> ${pill(d.final_review_state)} ${finalReviewBadge(d)}</div>
    <div class="muted">revisor: ${esc(fr.reviewer||'—')} · tentativa ${esc(fr.attempt||'—')} · snapshot ${esc(fr.snapshot_hash||'—')}${fr.workspace_changed_since_last_attempt?' · <span class="lvl-warning">arquivos mudaram desde a tentativa anterior</span>':''}</div>
    ${own.length?`<div class="lvl-warning muted">Implementadas pelo próprio revisor (cobertura só por revisão cruzada): ${own.map(esc).join(', ')}</div>`:''}
    ${cov?`<div class="muted">cobertura: ${cov}</div>`:''}
    ${fr.detail?`<pre>${esc(fr.detail)}</pre>`:''}

    ${needs?`<div class="row"><button class="sec" onclick="finalDecide('accept')">aceitar mesmo assim</button><button class="danger" onclick="finalDecide('reject')">rejeitar</button><span class="muted">ou Retomar para nova revisão final</span></div>`:''}</div>`; }

    h=`<div class="box2"><b>Busca Semântica & Contexto (RAG)</b><div class="muted">Consulta a base vetorial de arquivos do workspace e decisões técnicas.</div>
      <div class="row" style="margin-top:8px"><input id="ragQuery" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px" placeholder="Digite uma consulta (ex.: persistência de dados, inventory, workflow)…" onkeydown="if(event.key==='Enter')doRagSearch()"/>
      <button class="sec" onclick="doRagSearch()">Buscar</button><button class="sec" onclick="doRagIndex()">Reindexar Workspace</button></div></div>
      <div id="ragResults" style="margin-top:10px">${(X.ragResults||[]).length?X.ragResults.map(r=>`<div class="sc"><div class="sh"><b class="mono">${esc(r.metadata?.path||r.doc_id)}</b><span class="pill s-ok">score ${r.score}</span></div>
        <div class="muted">${esc(r.metadata?.type||'doc')} · ${esc(r.chunk_id)}</div><pre style="max-height:120px">${esc(r.content)}</pre></div>`).join(''):'<span class="muted">Execute uma busca acima para consultar a base semântica.</span>'}</div>`;
  }
  else if(tsec==='plan') h=`<pre style="max-height:600px">${esc(JSON.stringify({dependency_analysis:d.dependency_analysis, stages:d.stages, metrics:d.metrics, plan:d.plan, result:d.result, context:d.context, error:d.error}, null, 2))}</pre>`;
  else if(tsec==='messages') h=(X.m||[]).map(x=>row(x.created_at,`${x.sender} → ${x.recipient}`,`${x.skill||''} ${x.a2a_state||''}`,x.summary)).join('')||none;
  else if(tsec==='files') h=(X.f||[]).map(c=>`<div class="lr"><b class="mono">${esc(c.path)}</b> <span class="muted">${esc(c.change_type)} · ${esc(c.agent)} · ${esc(c.source)}</span> ${c.within_reservation?pill('ok'):'<span class="pill s-err">fora da reserva</span>'}</div>`).join('')||'<span class="muted">Nenhuma alteração registrada.</span>';
  else if(tsec==='events'||tsec==='errors'){
    const src=tsec==='events'?(d?d.events||[]:[]):ERR, fl=[['todos','Todos'],['error','Erros'],['warning','Avisos'],...AG.map(a=>[a.name,short(a.display_name)])];
    h=`<div class="chips" style="margin-bottom:8px">${fl.map(([k,v])=>`<button class="chip ${k===flt?'on':''}" onclick="flt='${esc(k)}';renderTech(true)">${esc(v)}</button>`).join('')}</div>`+(src.filter(pass).sort(byTime).slice(0,120).map(e=>row(e.created_at,e.agent,e.event,e.content,'lvl-'+esc(e.level))).join('')||none); }
  else if(tsec==='decisions') h=DEC.map(x=>row(x.created_at,x.author,`#${x.id} ${x.status}`,`${x.title}: ${x.decision}`)).join('')||none;
  else if(tsec==='locks') h='<div class="muted">Ativas</div>'+(LK.map(x=>`<div class="lr"><b class="mono">${esc(x.resource)}</b> <span class="muted">dono ${esc(x.owner)} · subtarefa ${esc(x.subtask_id)} · expira ${t(x.expires_at)}</span></div>`).join('')||'<div class="muted">nenhuma</div>')+'<div class="muted" style="margin-top:10px">Histórico</div>'+LKH.map(x=>row(x.created_at,x.owner,x.action,x.resource,CONF.test(x.action||'')?'lvl-error':'')).join('');
  else if(tsec==='runs') h=(X.r||[]).map(x=>row(x.created_at,x.agent,`${x.skill||''} · ${x.status} · ${x.duration_seconds??'?'}s`,x.error||(x.usage?JSON.stringify(x.usage):''),x.error?'lvl-error':'')).join('')||none;
  else if(tsec==='allmsg') h=(X.a||[]).map(x=>row(x.created_at,`${x.sender} → ${x.recipient}`,`${x.skill||''} ${x.a2a_state||''}`,x.summary)).join('')||none;
  else if(tsec==='agents') h=`<div class="row"><button class="sec" onclick="discover()">Descobrir Agent Cards</button><button class="sec" onclick="checkAll(true)">Verificar (sem tokens)</button></div>`+AG.map(a=>{ const hh=a.health||{}, cur=ACT.find(x=>String(x.agent).toLowerCase()===a.name.toLowerCase());
    return `<div class="box2"><div><b>${esc(a.display_name)}</b> ${pill(hh.status||'unknown')} ${a.accepting_work?'':pill('blocked')}</div><div class="muted">função: ${esc(a.role)} · backend: ${esc(a.backend)}</div>
      <div>modelo configurado: <span class="mono">${esc(a.model)}</span>${cur&&cur.model?` · em uso agora: <span class="mono">${appx(cur.source)}${esc(cur.model)}</span>`:''}</div>
      <div class="muted">skills: ${(a.skills||[]).map(esc).join(', ')}</div>${a.blocked_reason?`<div class="lvl-warning muted">${esc(a.blocked_reason)}</div>`:''}${hh.detail?`<div class="muted">${esc(hh.detail)}</div>`:''}
      <div class="row" style="margin:0"><button class="sec" onclick="check('${esc(a.name)}', true)">Verificar</button><a href="${esc(a.agent_card_url)}" target="_blank">agent-card.json</a> ${a.a2a_card_reachable===null?'':(a.a2a_card_reachable?pill('ok'):pill('failed'))}</div></div>`; }).join('');
  else if(tsec==='mcp'){ const ids=Object.keys(MCPD); h=ids.length?ids.map(id=>`<div class="box2"><b>${esc(id)}</b> ${pill(MCPD[id].server_state)}<div class="muted">${Object.entries(MCPD[id].agents).map(([a,v])=>`${esc(a)}: ${esc(v.state)} (${esc(v.role)})`).join(' · ')}</div></div>`).join(''):'<span class="muted">Nenhum servidor MCP configurado (config/mcp_servers.json).</span>'; }
  setHTML($('#tbody'), h, force);
}

async function refresh(){ await loadHealth(); await loadWorkflows(true); await Promise.all([loadAgents(), loadDetail(true), loadGlobal(true), loadMcp()]); }
refresh(); setInterval(() => { loadWorkflows(); loadDetail(); loadAgents(); if(vw==='tech') loadTech(); }, 3000); setInterval(() => { loadGlobal(); loadMcp(); loadHealth(); }, 10000);
</script>
</body>
</html>
